<!-- staff-modal.html -->
<div id="staff-modal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center;">
    <div class="modal-content glass" style="width: 450px; padding: 40px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h3>Create Staff Account</h3>
            <span style="cursor: pointer; color: var(--text-dim);" onclick="UI.toggleModal('staff-modal')">✕</span>
        </div>
        <form id="create-staff-form" style="display: flex; flex-direction: column; gap: 20px;">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="staff-username" placeholder="Full Name" required style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: white;">
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="staff-email" placeholder="staff@stitchopt.com" required style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: white;">
            </div>
            <div class="input-group">
                <label>Access Role</label>
                <select id="staff-role" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: white;">
                    <option value="employee">Production Staff</option>
                    <option value="admin">System Administrator</option>
                </select>
            </div>
            <div class="input-group">
                <label>Contact Number</label>
                <input type="text" id="staff-phone" placeholder="09XX XXX XXXX" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: white;">
            </div>
            <div class="input-group">
                <label>Home Address</label>
                <input type="text" id="staff-address" placeholder="Unit, Street, City" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: white;">
            </div>
            <div class="input-group">
                <label id="staff-password-label">Password</label>
                <input type="password" id="staff-password" placeholder="••••••••" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: white;">
            </div>
            <button type="submit" id="staff-submit-btn" class="btn btn-primary" style="width: 100%; padding: 14px;">Establish Personnel Account</button>
        </form>
    </div>
</div>
