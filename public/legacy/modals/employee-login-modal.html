<!-- employee-login-modal.html -->
<div id="module-login-screen" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-dark); z-index: 9999; justify-content: center; align-items: center;">
    <div class="glass" style="padding: 40px; border-radius: 20px; width: 100%; max-width: 420px; text-align: center;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary); margin-bottom: 20px;">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        <h2 style="margin-bottom: 8px; font-size: 1.8rem;">Staff Terminal</h2>
        <p style="color: var(--text-dim); margin-bottom: 30px;">Employee identification required</p>
        <form id="employee-login-form">
            <input type="text" id="employee-login-email" placeholder="Staff ID / Email" required style="width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; background: rgba(0,0,0,0.2); color: white; border: 1px solid var(--border-glass); outline: none;">
            <input type="password" id="employee-login-pass" placeholder="Passcode" required style="width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; background: rgba(0,0,0,0.2); color: white; border: 1px solid var(--border-glass); outline: none;">
            <p id="employee-login-error" style="color: #ef4444; font-size: 0.9rem; display: none; margin-bottom: 20px; text-align: left;"></p>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;">Authenticate</button>
        </form>
        <a href="index.html" style="display: block; margin-top: 25px; color: var(--text-dim); text-decoration: none; font-size: 0.85rem;">← Return to Public Storefront</a>
    </div>
</div>
