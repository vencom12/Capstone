<!-- checkout-modal.html -->
<div id="checkout-modal" class="modal-overlay" style="display: none;">
    <div class="modal glass checkout-modal-content">
        <div class="checkout-modal-header">
            <h2 style="margin: 0; display: flex; align-items: center; gap: 12px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                    <path d="M3 6h18" />
                    <path d="M16 10a4 4 0 0 1-8 0" />
                </svg>
                Secure Checkout
            </h2>
            <span onclick="CheckoutManager.close()" style="cursor: pointer; font-size: 1.5rem; opacity: 0.5;">✕</span>
        </div>

        <div class="checkout-grid">
            <!-- Left: Delivery & Summary -->
            <div class="checkout-left">
                <div class="checkout-section">
                    <h3 class="checkout-section-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                            <circle cx="12" cy="10" r="3" />
                        </svg>
                        Delivery Details
                    </h3>
                    <div class="input-group">
                        <input type="text" id="checkout-address" placeholder="Registered Address" readonly style="background: rgba(255,255,255,0.05); color: var(--text-dim); cursor: not-allowed;">
                        <p style="font-size: 0.7rem; color: var(--text-dim); margin-top: 4px;">To change address, please update your profile settings.</p>
                    </div>
                    <div class="input-group">
                        <input type="text" id="checkout-time" placeholder="Preferred Delivery Time (e.g. 2 PM - 4 PM)" required>
                    </div>
                    <div class="input-group">
                        <textarea id="checkout-notes" placeholder="Special notes to seller..." rows="2"></textarea>
                    </div>
                </div>

                <div class="checkout-section" style="margin-top: 24px;">
                    <h3 class="checkout-section-title">Order Summary</h3>
                    <div id="checkout-summary-list" class="checkout-summary-list">
                        <!-- Items populated by JS -->
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-top: 16px; font-weight: 700; font-size: 1.1rem; padding: 0 8px;">
                        <span>Total Amount:</span>
                        <span id="checkout-total-price" style="color: var(--primary);">$0.00</span>
                    </div>
                </div>
            </div>

            <!-- Right: Payment & Action -->
            <div class="checkout-right">
                <div class="checkout-section">
                    <h3 class="checkout-section-title">Payment Method</h3>

                    <!-- Wallet Card -->
                    <div class="wallet-balance-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                            <span style="font-size: 0.8rem; opacity: 0.8;">Wallet Balance</span>
                            <span id="checkout-wallet-balance" style="font-weight: 700; font-size: 1.1rem;">$0.00</span>
                        </div>
                        <div class="top-up-input-group">
                            <input type="number" id="topup-amount" placeholder="Add Amount" min="1">
                            <button onclick="CheckoutManager.topup()" class="btn btn-primary" style="padding: 8px 12px; font-size: 0.8rem;">Top Up</button>
                        </div>
                    </div>

                    <div class="payment-methods-grid">
                        <button onclick="CheckoutManager.selectMethod('wallet')" id="pay-btn-wallet" class="payment-method-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4" />
                                <path d="M4 6v12c0 1.1.9 2 2 2h14v-4" />
                                <path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z" />
                            </svg>
                            <span>Wallet Credits</span>
                        </button>
                        <button onclick="CheckoutManager.selectMethod('cash_at_counter')" id="pay-btn-cash" class="payment-method-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="6" width="20" height="12" rx="2" />
                                <circle cx="12" cy="12" r="2" />
                                <path d="M6 12h.01M18 12h.01" />
                            </svg>
                            <span>Cash at Counter</span>
                        </button>

                        <button disabled class="payment-method-btn" style="opacity: 0.6; cursor: not-allowed; border-style: dashed;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#007df2" stroke-width="2">
                                <rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                                <circle cx="12" cy="15" r="2"></circle>
                            </svg>
                            <span>GCash</span>
                        </button>

                        <button disabled class="payment-method-btn" style="opacity: 0.6; cursor: not-allowed; border-style: dashed;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2">
                                <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                                <path d="M2 17l10 5 10-5M2 12l10 5 10-5"></path>
                            </svg>
                            <span>PayMaya</span>
                        </button>
                    </div>
                </div>
                <div class="verification-status">
                    <span>Payment Status:</span>
                    <span id="checkout-verification-badge" class="status-badge pending">Pending</span>
                </div>
            </div>
        </div>

        <div class="checkout-modal-footer">
            <button id="place-order-btn" onclick="CheckoutManager.placeOrder()" class="btn btn-primary" style="opacity: 0.5; pointer-events: none;">
                Place Order
            </button>
        </div>
    </div>
</div>
