<!-- create-product-modal.html -->
<div id="create-product-modal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
    <div class="modal glass animate-fade" style="max-width: 600px; width: 90%; padding: 40px; position: relative;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="font-size: 1.5rem;">Create New Design</h2>
            <span style="cursor: pointer; color: var(--text-dim);" onclick="UI.toggleModal('create-product-modal')">✕</span>
        </div>

        <form id="create-product-form">
            <div class="responsive-split-grid">
                <div class="input-group">
                    <label>Design Name</label>
                    <input type="text" id="product-name" placeholder="e.g. Vintage Rose" required style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: white;">
                </div>
                <div class="input-group">
                    <label>Price ($)</label>
                    <input type="number" id="product-price" step="0.01" placeholder="29.99" required style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: white;">
                </div>
            </div>

            <div class="input-group" style="margin-top: 20px;">
                <label>Category / Tag</label>
                <input type="text" id="product-tag" placeholder="e.g. Floral, Sport, Premium" required style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: white;">
            </div>

            <div class="input-group" style="margin-top: 20px;">
                <label>Description</label>
                <textarea id="product-desc" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); padding: 12px; border-radius: 12px; color: white; min-height: 80px;" placeholder="Brief details about the design..."></textarea>
            </div>

            <div class="input-group" style="margin-top: 20px;">
                <label>Design Image</label>
                <input type="file" id="product-image-file" accept="image/*" style="padding: 10px; color: white;">
                <p style="font-size: 0.8rem; color: var(--text-dim); margin-top: 4px;">Recommended: Square image, max 1MB.</p>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 30px; padding: 14px;">Publish to Catalog</button>
        </form>
    </div>
</div>
