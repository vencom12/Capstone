<!-- create-product-modal.html -->
<div id="create-product-modal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center;">
    <div class="modal glass animate-fade">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="font-size: 1.5rem; margin: 0;">Publish New Design</h2>
            <span style="cursor: pointer; color: var(--text-dim); font-size: 1.2rem;" onclick="UI.toggleModal('create-product-modal')">✕</span>
        </div>

        <form id="create-product-form">
            <div class="responsive-form-grid">
                <div class="input-group">
                    <label>Design Name</label>
                    <input type="text" id="product-name" placeholder="e.g. Vintage Rose" required style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: white;">
                </div>
                <div class="input-group">
                    <label>Price ($)</label>
                    <input type="number" id="product-price" step="0.01" placeholder="29.99" required style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: white;">
                </div>
                <div class="input-group">
                    <label>Category / Tag</label>
                    <input type="text" id="product-tag" placeholder="e.g. Floral, Sport" required style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: white;">
                </div>
                <div class="input-group">
                    <label>Design Image</label>
                    <input type="file" id="product-image-file" accept="image/*" style="padding: 10px; color: white;">
                </div>
            </div>

            <div class="input-group" style="margin-bottom: 24px;">
                <label>Description</label>
                <textarea id="product-desc" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); padding: 12px; border-radius: 12px; color: white; min-height: 80px;" placeholder="Brief details about the design..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-weight: 700;">Publish to Catalog</button>
        </form>
    </div>

</div>
