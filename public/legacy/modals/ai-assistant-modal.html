<!-- ai-assistant-modal.html -->
<div id="ai-float-window" class="ai-hidden" style="position: fixed; bottom: 24px; left: 300px; width: 420px; height: 520px; background: rgba(15, 23, 42, 0.15); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px rgba(99,102,241,0.1); z-index: 9999; display: flex; flex-direction: column; overflow: hidden; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--border-glass); background: rgba(99,102,241,0.05);">
        <div style="display: flex; align-items: center; gap: 10px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2">
                <path d="m12 8-9.04 9.06a2.82 2.82 0 1 0 3.98 3.98L16 12" />
                <circle cx="17" cy="7" r="5" />
            </svg>
            <span style="font-weight: 700; font-size: 1rem; color: white;">StitchMaster AI</span>
        </div>
        <span onclick="document.getElementById('ai-float-window').classList.add('ai-hidden')" style="cursor: pointer; color: var(--text-dim); font-size: 1.2rem; padding: 4px 8px; border-radius: 8px; transition: background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='transparent'">✕</span>
    </div>
    <div id="ai-chat-messages" style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px;"></div>
    <div style="padding: 12px 16px; border-top: 1px solid var(--border-glass); background: rgba(0,0,0,0.2);">
        <input type="text" id="ai-chat-input" placeholder="Ask me anything about the system..." style="width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--border-glass); padding: 12px 16px; border-radius: 12px; color: white; outline: none; font-size: 0.9rem; transition: border-color 0.2s;" onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border-glass)'">
    </div>
</div>
