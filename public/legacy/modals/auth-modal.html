<!-- auth-modal.html -->
<div id="auth-overlay" class="auth-overlay">
    <div class="auth-dialog glass">
        <span class="close-auth" onclick="closeAuth()">✕</span>
        
        <!-- Login Section -->
        <div id="login-form-container">
            <h2 id="login-heading" style="margin-bottom: 24px; font-size: 1.8rem; font-weight: 700;">Secure Access</h2>
            <form id="main-login-form">
                <div class="input-group">
                    <label>Username / Email</label>
                    <input type="text" id="login-email" placeholder="e.g. user@stitchopt.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="login-pass" placeholder="••••••••" required>
                </div>
                <div id="login-error" style="color: #ef4444; font-size: 0.9rem; margin-bottom: 20px; display: none;"></div>

                <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="login-remember" style="width: 16px; height: 16px; cursor: pointer;">
                    <label for="login-remember" style="margin: 0; font-size: 0.9rem; color: var(--text-dim); cursor: pointer;">Stay logged in</label>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;">Establish Link</button>
                
                <div style="margin-top: 20px; color: var(--text-dim); font-size: 0.9rem; text-align: center;">
                    No account? <a href="#" onclick="toggleAuthMode('register')" style="color: var(--primary); font-weight: 600;">Create one here</a>
                </div>
                
                <div style="margin-top: 24px; border-top: 1px solid var(--border-glass); padding-top: 20px; font-size: 0.85rem; display: flex; justify-content: space-around;">
                    <span style="color: var(--text-dim); font-weight: 600;">Staff Modules:</span>
                    <a href="admin.html" style="color: var(--primary); text-decoration: none;">Admin Login</a>
                    <a href="employee.html" style="color: var(--primary); text-decoration: none;">Employee Login</a>
                </div>
            </form>
        </div>

        <!-- Register Section -->
        <div id="register-form-container" style="display: none;">
            <h2 style="margin-bottom: 24px; font-size: 1.8rem; font-weight: 700;">Join Stitch-Opt</h2>
            <form id="main-register-form">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" id="reg-username" placeholder="johndoe" required>
                    </div>
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="reg-email" placeholder="john@example.com" required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="input-group">
                        <label>Phone Number</label>
                        <input type="tel" id="reg-phone" placeholder="+63..." required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="reg-password" placeholder="Min. 8 chars" required minlength="8">
                    </div>
                </div>
                <div class="input-group">
                    <label>Full Address</label>
                    <textarea id="reg-address" placeholder="123 Street, City, ZIP" required style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); padding: 12px; border-radius: 12px; color: white; outline: none; min-height: 80px; resize: none;"></textarea>
                </div>
                <div id="register-error" style="color: #ef4444; font-size: 0.9rem; margin-bottom: 20px; display: none;"></div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;">Secure Registration</button>
                
                <div style="margin-top: 20px; color: var(--text-dim); font-size: 0.9rem; text-align: center;">
                    Already have an account? <a href="#" onclick="toggleAuthMode('login')" style="color: var(--primary); font-weight: 600;">Sign In</a>
                </div>
            </form>
        </div>
    </div>
</div>
