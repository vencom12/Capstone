<!-- auth-modal.html -->
<div id="auth-overlay" class="auth-overlay">
    <div class="auth-dialog">
        <span class="close-auth" onclick="closeAuth()">✕</span>
        <div id="login-form-container">
            <h2 id="login-heading" style="margin-bottom: 30px; font-size: 1.8rem; font-weight: 700;">Secure Access</h2>
            <form id="main-login-form">
                <div class="input-group">
                    <label>Username / Email</label>
                    <input type="text" id="login-email" placeholder="e.g. user@stitchopt.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="login-pass" placeholder="••••••••" required>
                </div>
                <div id="login-error" style="color: #ef4444; font-size: 0.9rem; margin-bottom: 20px; display: none;"></div>

                <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="login-remember" style="width: 16px; height: 16px; cursor: pointer;">
                    <label for="login-remember" style="margin: 0; font-size: 0.9rem; color: var(--text-dim); cursor: pointer;">Stay logged in</label>
                </div>
                <button type="submit" class="header-btn primary">Establish Link</button>
                <div style="margin-top: 20px; color: var(--text-dim); font-size: 0.9rem;">
                    No account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Create one here</a>
                </div>
                <div style="margin-top: 20px; border-top: 1px solid var(--border-glass); padding-top: 20px; font-size: 0.85rem; display: flex; justify-content: space-around;">
                    <span style="color: var(--text-dim); font-weight: 600;">Staff Modules:</span>
                    <a href="admin.html" style="color: var(--primary); text-decoration: none;">Admin Login</a>
                    <a href="employee.html" style="color: var(--primary); text-decoration: none;">Employee Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
