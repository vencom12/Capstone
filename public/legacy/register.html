<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch-Opt | Create Client Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Modular Design System -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header/header-base.css">
    <link rel="stylesheet" href="css/header/header-logo.css">
    <link rel="stylesheet" href="css/header/header-navbar.css">
    <link rel="stylesheet" href="css/header/header-user.css">
    <link rel="stylesheet" href="css/sidebar/sidebar-base.css">
    <link rel="stylesheet" href="css/sidebar/sidebar-nav.css">
    <link rel="stylesheet" href="css/sidebar/sidebar-toggle.css">
    <link rel="stylesheet" href="css/sidebar/sidebar-submenu.css">
    <link rel="stylesheet" href="css/content/content-base.css">
    <link rel="stylesheet" href="css/content/content-cards.css">
    <link rel="stylesheet" href="css/content/content-table.css">
    <link rel="stylesheet" href="css/content/content-forms.css">
    <link rel="stylesheet" href="css/utilities/utilities.css">
    <link rel="stylesheet" href="css/responsive-tablet.css">
    <link rel="stylesheet" href="css/responsive-mobile.css">
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon.ico">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --bg-deep: #0f172a;
            --bg-gradient: radial-gradient(circle at top left, #1e1b4b, #0f172a);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-glass);
            border-radius: 4px;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .auth-subtitle {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            padding: 14px 18px;
            border-radius: 4px;
            color: white;
            outline: none;
            font-size: 1rem;
            transition: var(--transition-fast);
        }



        .input-group input:focus,
        .input-group textarea:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 12px;
            border-radius: 4px;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
    </style>
</head>

<body class="register-body">

    <div class="auth-card">
        <h1 class="brand-logo">Stitch-Opt</h1>
        <p class="auth-subtitle">Join the Intelligent Embroidery Network</p>

        <form id="register-form">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Choose a username" required>
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@company.com" required>
            </div>
            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" id="phoneNumber" placeholder="+63 (915) 865-2296" required>
            </div>
            <div class="input-group">
                <label>Full Address</label>
                <textarea id="address" placeholder="123 Main St, City, State, ZIP" required
                    style="width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-glass); padding: 14px; border-radius: 12px; color: white; outline: none; font-family: inherit; resize: vertical; min-height: 80px;"></textarea>
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Min. 8 characters" required minlength="8" style="padding-right: 45px;">
                    <span class="password-toggle" onclick="togglePasswordVisibility('password', this)">👁️</span>
                </div>
            </div>
            <div id="register-error" class="error-message">Registration failed. Try again.</div>

            <button type="submit" class="btn btn-primary auth-btn">Secure Registration</button>
        </form>

        <p style="margin-top: 24px; font-size: 0.9rem; color: var(--text-dim);">
            Already have an account? <a href="index.html" style="color: var(--primary); text-decoration: none;">Sign
                In</a>
        </p>
    </div>

    <script src="customer.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            const address = document.getElementById('address').value;
            const errorEl = document.getElementById('register-error');

            errorEl.style.display = 'none';

            if (password.length < 8) {
                errorEl.innerText = "Password must be at least 8 characters long.";
                errorEl.style.display = 'block';
                return;
            }

            if (window.AuthManager) {
                const result = await AuthManager.register(username, email, password, 'customer', phoneNumber, address);
                if (result.success) {
                    // Public registration always redirects to customer portal
                    window.location.href = 'user.html';
                } else {
                    errorEl.innerText = result.message || "Registration failed. User may already exist.";
                    errorEl.style.display = 'block';
                }
            }
        });
    </script>
</body>

</html>
