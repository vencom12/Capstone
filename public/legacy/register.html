<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch-Opt | Create Client Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Modular Design System -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header/header-base.css">
    <link rel="stylesheet" href="css/header/header-logo.css">
    <link rel="stylesheet" href="css/header/header-navbar.css">
    <link rel="stylesheet" href="css/header/header-user.css">
    <link rel="stylesheet" href="css/sidebar/sidebar-base.css">
    <link rel="stylesheet" href="css/sidebar/sidebar-nav.css">
    <link rel="stylesheet" href="css/sidebar/sidebar-toggle.css">
    <link rel="stylesheet" href="css/sidebar/sidebar-submenu.css">
    <link rel="stylesheet" href="css/content/content-base.css">
    <link rel="stylesheet" href="css/content/content-cards.css">
    <link rel="stylesheet" href="css/content/content-table.css">
    <link rel="stylesheet" href="css/content/content-forms.css">
    <link rel="stylesheet" href="css/utilities/utilities.css">
    <link rel="stylesheet" href="css/responsive-tablet.css">
    <link rel="stylesheet" href="css/responsive-mobile.css">
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon.ico">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --bg-deep: #0f172a;
            --bg-gradient: radial-gradient(circle at top left, #1e1b4b, #0f172a);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .register-container {
            width: 100%;
            max-width: 1000px;
            min-height: 650px;
            display: flex;
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            animation: fadeIn 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .register-hero {
            flex: 1;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.2), rgba(15, 23, 42, 0.8)), url('../icons/auth-hero.png');
            background-size: cover;
            background-position: center;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            border-right: 1px solid var(--border-glass);
        }

        .register-hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, rgba(99, 102, 241, 0.15), transparent);
            pointer-events: none;
        }

        .register-form-section {
            flex: 1.2;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(15, 23, 42, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .auth-subtitle {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .hero-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: white;
            margin-bottom: 15px;
            line-height: 1.1;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .hero-desc {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            line-height: 1.6;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dim);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            color: white;
            outline: none;
            font-size: 0.95rem;
            transition: var(--transition-fast);
        }

        .input-group input:focus,
        .input-group textarea:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 10px;
            border-radius: var(--radius-md);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
        }

        .error-message {
            color: #ef4444;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 900px) {
            .register-hero { display: none; }
            .register-container { max-width: 500px; }
        }

        @media (max-width: 500px) {
            .register-form-section { padding: 30px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body class="register-body">

    <div class="register-container">
        <div class="register-hero">
            <h2 class="hero-title">Intelligence in Every Stitch.</h2>
            <p class="hero-desc">Experience the future of embroidery with our high-speed, AI-optimized production network.</p>
        </div>

        <div class="register-form-section">
            <h1 class="brand-logo">Stitch-Opt</h1>
            <p class="auth-subtitle">Join the Intelligent Embroidery Network</p>

            <form id="register-form">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" id="username" placeholder="Choose a username" required>
                    </div>
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="name@company.com" required>
                    </div>
                </div>
                
                <div class="form-grid">
                    <div class="input-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phoneNumber" placeholder="+63 (9XX) XXX-XXXX" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="Min. 8 chars" required minlength="8" style="padding-right: 45px;">
                            <span class="password-toggle" onclick="togglePasswordVisibility('password', this)">👁️</span>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label>Full Delivery Address</label>
                    <textarea id="address" placeholder="123 Main St, City, State, ZIP" required
                        style="width: 100%; min-height: 80px; resize: none;"></textarea>
                </div>

                <div id="register-error" class="error-message">Registration failed. Try again.</div>

                <button type="submit" class="btn btn-primary auth-btn">Secure Registration</button>
            </form>

            <p style="margin-top: 24px; font-size: 0.9rem; color: var(--text-dim);">
                Already have an account? <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign In</a>
            </p>
        </div>
    </div>

    <script src="customer.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            const address = document.getElementById('address').value;
            const errorEl = document.getElementById('register-error');

            errorEl.style.display = 'none';

            if (password.length < 8) {
                errorEl.innerText = "Password must be at least 8 characters long.";
                errorEl.style.display = 'block';
                return;
            }

            if (window.AuthManager) {
                const result = await AuthManager.register(username, email, password, 'customer', phoneNumber, address);
                if (result.success) {
                    // Public registration always redirects to customer portal
                    window.location.href = 'user.html';
                } else {
                    errorEl.innerText = result.message || "Registration failed. User may already exist.";
                    errorEl.style.display = 'block';
                }
            }
        });
    </script>
</body>

</html>
