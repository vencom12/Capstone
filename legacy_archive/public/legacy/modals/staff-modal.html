<!-- staff-modal.html -->
<div id="staff-modal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center;">
    <div class="modal glass animate-fade">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h3 style="margin: 0;">Staff Personnel Details</h3>
            <span style="cursor: pointer; color: var(--text-dim); font-size: 1.2rem;" onclick="UI.toggleModal('staff-modal')">✕</span>
        </div>
        <form id="create-staff-form">
            <div class="responsive-form-grid">
                <div class="input-group">
                    <label style="color: var(--text-dim); font-size: 0.9rem;">Username</label>
                    <input type="text" id="staff-username" placeholder="Full Name" required style="width: 100%; background: var(--bg-surface); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: var(--text-main);">
                </div>
                <div class="input-group">
                    <label style="color: var(--text-dim); font-size: 0.9rem;">Email Address</label>
                    <input type="email" id="staff-email" placeholder="staff@stitchopt.com" required style="width: 100%; background: var(--bg-surface); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: var(--text-main);">
                </div>
                <div class="input-group">
                    <label style="color: var(--text-dim); font-size: 0.9rem;">Access Role</label>
                    <select id="staff-role" style="width: 100%; background: var(--bg-surface); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: var(--text-main);">
                        <option value="employee">Production Staff</option>
                        <option value="admin">System Administrator</option>
                    </select>
                </div>
                <div class="input-group">
                    <label style="color: var(--text-dim); font-size: 0.9rem;">Contact Number</label>
                    <input type="text" id="staff-phone" placeholder="09XX XXX XXXX" style="width: 100%; background: var(--bg-surface); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: var(--text-main);">
                </div>
                <div class="input-group">
                    <label style="color: var(--text-dim); font-size: 0.9rem;">Home Address</label>
                    <input type="text" id="staff-address" placeholder="Unit, Street, City" style="width: 100%; background: var(--bg-surface); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: var(--text-main);">
                </div>
                <div class="input-group">
                    <label id="staff-password-label" style="color: var(--text-dim); font-size: 0.9rem;">Set Password</label>
                    <input type="password" id="staff-password" placeholder="••••••••" style="width: 100%; background: var(--bg-surface); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: var(--text-main);">
                </div>
            </div>
            <button type="submit" id="staff-submit-btn" class="btn btn-primary" style="width: 100%; padding: 14px; font-weight: 700;">Establish Personnel Account</button>
        </form>
    </div>

</div>
