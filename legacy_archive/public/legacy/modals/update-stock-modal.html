<div id="update-stock-modal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
    <div class="modal-content glass animate-fade" style="width: 100%; max-width: 400px; padding: 30px; border-radius: var(--radius-lg); border: 1px solid var(--border-glass); box-shadow: var(--shadow-xl);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 id="update-stock-title" style="margin: 0; font-size: 1.25rem; font-weight: 700; color: var(--text-main);">Update Stock</h3>
            <span style="cursor: pointer; color: var(--text-dim); font-size: 1.2rem; transition: color 0.2s;" onclick="ModalManager.close('UPDATE_STOCK')">✕</span>
        </div>
        
        <form id="update-stock-form" style="display: flex; flex-direction: column; gap: 16px;">
            <input type="hidden" id="update-stock-id">
            
            <div style="background: rgba(255,255,255,0.03); border-radius: 12px; padding: 15px; border: 1px solid var(--border-glass); text-align: center;">
                <p style="margin: 0; color: var(--text-dim); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">Current Stock</p>
                <h2 id="update-stock-current" style="margin: 8px 0 0 0; color: var(--primary); font-size: 1.75rem; font-weight: 800;">0</h2>
            </div>

            <div class="input-group">
                <label style="color: var(--text-dim); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; display: block;">Action</label>
                <select id="update-stock-action" required style="width: 100%; background: var(--bg-surface); border: 1px solid var(--border-glass); padding: 10px; border-radius: 8px; color: var(--text-main); outline: none;">
                    <option value="Deduct">Deduct Stock (Usage)</option>
                    <option value="Add">Add Stock (Restock)</option>
                </select>
            </div>

            <div class="input-group">
                <label style="color: var(--text-dim); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; display: block;">Quantity</label>
                <input type="number" id="update-stock-amount" min="1" required placeholder="e.g. 5" style="width: 100%; background: var(--bg-surface); border: 1px solid var(--border-glass); padding: 10px; border-radius: 8px; color: var(--text-main); outline: none;">
            </div>

            <div class="input-group admin-only-field" id="threshold-field-container">
                <label style="color: var(--text-dim); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; display: block;">Alert Threshold</label>
                <input type="number" id="update-stock-threshold" min="0" required placeholder="e.g. 10" value="10" style="width: 100%; background: var(--bg-surface); border: 1px solid var(--border-glass); padding: 10px; border-radius: 8px; color: var(--text-main); outline: none;">
                <p style="margin: 5px 0 0 0; font-size: 0.75rem; color: var(--text-dim);">Low-stock alert will trigger at this level.</p>
            </div>

            <button type="submit" id="update-stock-submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px; font-size: 0.95rem; font-weight: 700;">Save Changes</button>
        </form>
    </div>
</div>
