<div id="create-material-modal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center; pointer-events: auto;">
    <div class="modal-content glass animate-fade" style="width: 450px; padding: 40px; border-radius: 12px; border: 1px solid var(--border-glass); pointer-events: auto; position: relative;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <h3 style="margin: 0; font-size: 1.5rem; color: var(--text-main);">Add New Material</h3>
            <span style="cursor: pointer; color: var(--text-dim); font-size: 1.2rem; transition: color 0.2s;" onclick="UI.toggleModal('create-material-modal')" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-dim)'">✕</span>
        </div>
        
        <form id="create-material-form" style="display: flex; flex-direction: column; gap: 20px;">
            <div class="input-group">
                <label style="color: var(--text-dim); font-size: 0.9rem;">Material Name</label>
                <input type="text" id="create-material-name" required placeholder="e.g. Red Cotton Thread" style="width: 100%; background: var(--bg-surface); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: var(--text-main);">
            </div>

            <div class="input-group">
                <label style="color: var(--text-dim); font-size: 0.9rem;">Initial Stock</label>
                <input type="number" id="create-material-stock" min="0" required value="0" style="width: 100%; background: var(--bg-surface); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: var(--text-main);">
            </div>

            <div class="input-group">
                <label style="color: var(--text-dim); font-size: 0.9rem;">Unit</label>
                <input type="text" id="create-material-unit" required placeholder="e.g. Cones, Pieces, Yards" value="Cones" style="width: 100%; background: var(--bg-surface); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: var(--text-main);">
            </div>

            <div class="input-group">
                <label style="color: var(--text-dim); font-size: 0.9rem;">Low Stock Threshold</label>
                <input type="number" id="create-material-threshold" min="0" required placeholder="e.g. 10" value="10" style="width: 100%; background: var(--bg-surface); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; color: var(--text-main);">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; margin-top: 10px; font-size: 1rem; font-weight: 600;">Create Material</button>
        </form>
    </div>
</div>
